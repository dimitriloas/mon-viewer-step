<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ASTEC-STEP Viewer Pro</title>
    <style>
        :root { --primary: #2563eb; --panel: rgba(255, 255, 255, 0.95); }
        body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; background: #cbd5e1; }
        #ui { 
            position: absolute; top: 10px; left: 10px; z-index: 100; 
            background: var(--panel); padding: 15px; border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 280px;
            max-height: 90vh; overflow-y: auto;
        }
        h3, h4 { margin: 8px 0; color: #1e293b; border-left: 4px solid var(--primary); padding-left: 8px; }
        hr { border: 0; border-top: 1px solid #ddd; margin: 12px 0; }
        .btn-group { display: flex; flex-direction: column; gap: 6px; }
        button {
            padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; background: white;
            cursor: pointer; transition: 0.2s; text-align: left; font-weight: 500;
        }
        button:hover { background: #f8fafc; border-color: var(--primary); }
        button.active { background: var(--primary); color: white; border-color: var(--primary); }
        #partList { max-height: 200px; overflow-y: auto; background: #fff; border-radius: 6px; border: 1px solid #cbd5e1; margin-top: 5px; }
        .part-item { display: flex; justify-content: space-between; font-size: 11px; padding: 6px; border-bottom: 1px solid #eee; align-items: center; }
        #measureOutput { margin-top: 10px; padding: 10px; background: #1e293b; color: #fbbf24; border-radius: 8px; font-family: monospace; font-size: 12px; min-height: 20px; }
        #status { padding: 10px; border-radius: 8px; font-size: 12px; margin-bottom: 10px; }
        .status-info { background: #dbeafe; color: #1e40af; }
        .status-error { background: #fee2e2; color: #b91c1c; }
        .status-success { background: #dcfce7; color: #166534; }
        .diagnostic { background: #fef3c7; color: #92400e; padding: 12px; border-radius: 8px; font-size: 11px; margin-bottom: 10px; line-height: 1.5; }
        .diagnostic strong { display: block; margin-bottom: 5px; }
    </style>
</head>
<body>

<div id="ui">
    <h3>STEP Viewer Pro</h3>
    
    <div id="status" class="status-info">🔍 Vérification du système...</div>
    <div id="diagnostic"></div>
    
    <input type="file" id="fileInput" accept=".step,.stp" style="width:100%; margin-bottom: 10px;" disabled>

    <div class="btn-group">
        <button id="btn-view" class="active" onclick="window.setMode('view')">👁️ Vue Libre</button>
        <button id="btn-measure" onclick="window.setMode('measure')">📏 Mesurer (2 pts)</button>
        <button id="btn-hide" onclick="window.setMode('hide')">🚫 Masquer au clic</button>
        <button onclick="window.toggleTransparency()">👻 Transparence</button>
    </div>

    <div id="measureOutput">Mode : Vue libre</div>

    <hr>
    <h4>Vue en coupe (X)</h4>
    <input type="range" id="clipSlider" min="-100" max="100" value="100" style="width:100%">
    
    <hr>
    <h4>Nomenclature</h4>
    <div id="partList">En attente de modèle...</div>
    
    <button onclick="location.reload()" style="margin-top:15px; width:100%; background:#fee2e2; color:#b91c1c; border:none; padding:12px; font-weight:bold; border-radius:8px; cursor:pointer;">🔄 Réinitialiser</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.145.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/occt-import-js@0.0.12/dist/occt-import-js.js"></script>

<script>
    let scene, camera, renderer, controls, modelGroup;
    let currentMode = 'view', measurePoints = [], isTransparent = false;
    let clipPlane;
    let occtInstance = null;
    let systemReady = false;

    function showStatus(msg, type = 'info') {
        const statusEl = document.getElementById('status');
        statusEl.textContent = msg;
        statusEl.className = 'status-' + type;
        statusEl.style.display = 'block';
    }

    function showDiagnostic(html) {
        const diagEl = document.getElementById('diagnostic');
        diagEl.innerHTML = html;
        diagEl.style.display = 'block';
    }

    function hideDiagnostic() {
        document.getElementById('diagnostic').style.display = 'none';
    }

    async function checkSystem() {
        showStatus('🔍 Vérification du système...', 'info');
        
        const checks = {
            three: typeof THREE !== 'undefined',
            orbitControls: typeof THREE !== 'undefined' && THREE.OrbitControls !== 'undefined',
            occtLib: typeof occtimportjs !== 'undefined',
            sharedArrayBuffer: false
        };

        // Test SharedArrayBuffer (nécessaire pour OCCT)
        try {
            new SharedArrayBuffer(1);
            checks.sharedArrayBuffer = true;
        } catch (e) {
            checks.sharedArrayBuffer = false;
        }

        console.log('Vérifications système:', checks);

        // Afficher le diagnostic
        let diagnostic = '<strong>📋 Diagnostic système :</strong>';
        diagnostic += `<br>✅ THREE.js : ${checks.three ? 'OK' : '❌ ERREUR'}`;
        diagnostic += `<br>✅ OrbitControls : ${checks.orbitControls ? 'OK' : '❌ ERREUR'}`;
        diagnostic += `<br>✅ OCCT Library : ${checks.occtLib ? 'OK' : '❌ ERREUR'}`;
        diagnostic += `<br>✅ SharedArrayBuffer : ${checks.sharedArrayBuffer ? 'OK' : '❌ ERREUR'}`;

        if (!checks.sharedArrayBuffer) {
            diagnostic += '<br><br><strong>⚠️ PROBLÈME DÉTECTÉ :</strong><br>';
            diagnostic += 'Les en-têtes COOP/COEP ne sont pas actifs.<br>';
            diagnostic += '<strong>Solution :</strong> Vérifiez que vercel.json est bien à la racine du projet.';
        }

        showDiagnostic(diagnostic);

        return checks.three && checks.occtLib && checks.sharedArrayBuffer;
    }

    async function initOCCT() {
        try {
            showStatus('⏳ Chargement de la bibliothèque OCCT...', 'info');
            occtInstance = await occtimportjs();
            showStatus('✅ Système prêt ! Chargez un fichier STEP', 'success');
            return true;
        } catch (err) {
            console.error('Erreur OCCT:', err);
            showStatus('❌ Erreur : ' + err.message, 'error');
            showDiagnostic(
                '<strong>❌ Impossible de charger OCCT</strong><br>' +
                'Cause probable : En-têtes COOP/COEP manquants.<br><br>' +
                '<strong>Solution :</strong><br>' +
                '1. Vérifiez que <code>vercel.json</code> est à la racine<br>' +
                '2. Forcez un redéploiement sur Vercel<br>' +
                '3. Videz le cache du navigateur (Ctrl+Shift+R)'
            );
            return false;
        }
    }

    async function init() {
        showStatus('🚀 Initialisation...', 'info');

        // Vérifier le système
        const systemOK = await checkSystem();
        if (!systemOK) {
            showStatus('❌ Système non compatible', 'error');
            return;
        }

        // Initialiser Three.js
        try {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xd1d5db);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 100000);
            camera.position.set(1000, 1000, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.localClippingEnabled = true;
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const light = new THREE.DirectionalLight(0xffffff, 0.6);
            light.position.set(500, 1000, 750);
            scene.add(light);

            const light2 = new THREE.DirectionalLight(0xffffff, 0.4);
            light2.position.set(-500, -1000, -750);
            scene.add(light2);

            modelGroup = new THREE.Group();
            scene.add(modelGroup);

            clipPlane = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 2000);

            const axesHelper = new THREE.AxesHelper(100);
            scene.add(axesHelper);

            window.addEventListener('resize', onWindowResize);
            animate();

            console.log('✅ Three.js initialisé');

            // Initialiser OCCT
            const occtOK = await initOCCT();
            if (occtOK) {
                systemReady = true;
                document.getElementById('fileInput').disabled = false;
                hideDiagnostic();
            }

        } catch (err) {
            console.error('Erreur d\'initialisation:', err);
            showStatus('❌ Erreur : ' + err.message, 'error');
        }
    }

    window.setMode = (m) => {
        currentMode = m;
        measurePoints = [];
        document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
        const btn = document.getElementById('btn-' + m);
        if(btn) btn.classList.add('active');
        
        const modeNames = {
            'view': 'Vue libre',
            'measure': 'Mesure (cliquez 2 points)',
            'hide': 'Masquer au clic'
        };
        document.getElementById('measureOutput').innerText = `Mode : ${modeNames[m] || m}`;
    };

    window.toggleTransparency = () => {
        isTransparent = !isTransparent;
        modelGroup.traverse(c => { 
            if(c.isMesh) { 
                c.material.transparent = isTransparent; 
                c.material.opacity = isTransparent ? 0.3 : 1.0;
                c.material.depthWrite = !isTransparent;
                c.material.needsUpdate = true;
            }
        });
    };

    window.togglePart = (index) => {
        if (!modelGroup) return;
        const meshes = modelGroup.children.filter(c => c.isMesh);
        const part = meshes[index];
        if(part) {
            part.visible = !part.visible;
            updatePartList();
        }
    };

    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        if (!systemReady || !occtInstance) {
            showStatus('❌ Système non prêt. Rechargez la page.', 'error');
            return;
        }

        showStatus('📖 Lecture du fichier...', 'info');
        
        try {
            const buffer = await file.arrayBuffer();
            console.log('📦 Fichier chargé:', file.name, buffer.byteLength, 'octets');
            
            showStatus('🔧 Analyse du modèle 3D...', 'info');
            
            const fileData = new Uint8Array(buffer);
            const result = occtInstance.ReadStepFile(fileData);

            console.log('📊 Résultat OCCT:', result);

            if (result && result.success && result.meshes && result.meshes.length > 0) {
                showStatus(`✨ Création de ${result.meshes.length} pièce(s)...`, 'info');
                
                modelGroup.clear();
                
                let meshCount = 0;
                result.meshes.forEach((mesh, i) => {
                    try {
                        if (!mesh.attributes || !mesh.attributes.position) {
                            console.warn(`⚠️ Mesh ${i} sans géométrie`);
                            return;
                        }
                        
                        const geo = new THREE.BufferGeometry();
                        geo.setAttribute('position', new THREE.Float32BufferAttribute(mesh.attributes.position.array, 3));
                        
                        if (mesh.attributes.normal) {
                            geo.setAttribute('normal', new THREE.Float32BufferAttribute(mesh.attributes.normal.array, 3));
                        } else {
                            geo.computeVertexNormals();
                        }
                        
                        if (mesh.index) {
                            geo.setIndex(new THREE.Uint32BufferAttribute(mesh.index.array, 1));
                        }
                        
                        const color = new THREE.Color().setHSL(i / result.meshes.length, 0.7, 0.5);
                        
                        const mat = new THREE.MeshPhongMaterial({ 
                            color: color, 
                            side: THREE.DoubleSide,
                            clippingPlanes: [clipPlane],
                            flatShading: false
                        });
                        
                        const m = new THREE.Mesh(geo, mat);
                        m.name = mesh.name || `Pièce ${i+1}`;
                        modelGroup.add(m);
                        meshCount++;
                        
                        console.log(`✅ Mesh ${i} créé:`, m.name);
                    } catch (err) {
                        console.error(`❌ Erreur mesh ${i}:`, err);
                    }
                });
                
                if (meshCount > 0) {
                    fitCamera();
                    updatePartList();
                    updateClipBounds();
                    showStatus(`✅ ${meshCount} pièce(s) chargée(s) !`, 'success');
                    console.log('🎉 Modèle chargé avec succès');
                } else {
                    showStatus('❌ Aucune géométrie valide trouvée', 'error');
                }
            } else {
                showStatus('❌ Fichier STEP invalide ou corrompu', 'error');
                console.error('❌ Échec:', result);
            }
        } catch (err) {
            console.error('❌ Erreur complète:', err);
            showStatus('❌ Erreur : ' + err.message, 'error');
        }
    });

    function fitCamera() {
        const box = new THREE.Box3().setFromObject(modelGroup);
        if (box.isEmpty()) return;
        
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        
        controls.target.copy(center);
        const distance = maxDim * 2;
        camera.position.set(
            center.x + distance * 0.7,
            center.y + distance * 0.7,
            center.z + distance * 0.7
        );
        camera.lookAt(center);
        controls.update();
    }

    function updatePartList() {
        const list = document.getElementById('partList');
        list.innerHTML = '';
        
        const meshes = modelGroup.children.filter(c => c.isMesh);
        
        if (meshes.length === 0) {
            list.innerHTML = '<div class="part-item">Aucun modèle</div>';
            return;
        }
        
        meshes.forEach((m, i) => {
            const div = document.createElement('div');
            div.className = 'part-item';
            div.style.background = m.visible ? "transparent" : "#fee2e2";
            
            const btn = document.createElement('button');
            btn.textContent = m.visible ? '👁️' : '❌';
            btn.style.cssText = 'padding: 4px 8px; font-size: 14px;';
            btn.onclick = () => window.togglePart(i);
            
            const span = document.createElement('span');
            span.textContent = m.name;
            
            div.appendChild(span);
            div.appendChild(btn);
            list.appendChild(div);
        });
    }

    function updateClipBounds() {
        const box = new THREE.Box3().setFromObject(modelGroup);
        if (box.isEmpty()) return;
        
        const s = document.getElementById('clipSlider');
        s.min = Math.floor(box.min.x - 10);
        s.max = Math.ceil(box.max.x + 10);
        s.value = s.max;
        clipPlane.constant = parseFloat(s.value);
    }

    document.getElementById('clipSlider').addEventListener('input', (e) => {
        clipPlane.constant = parseFloat(e.target.value);
    });

    if (renderer && renderer.domElement) {
        renderer.domElement.addEventListener('mousedown', (e) => {
            if(currentMode === 'view') return;
            
            const rect = renderer.domElement.getBoundingClientRect();
            const mouse = new THREE.Vector2(
                ((e.clientX - rect.left) / rect.width) * 2 - 1,
                -((e.clientY - rect.top) / rect.height) * 2 + 1
            );
            
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(modelGroup.children, false);
            
            if(intersects.length > 0) {
                const res = intersects[0];
                
                if(currentMode === 'hide') {
                    res.object.visible = false;
                    updatePartList();
                }
                
                if(currentMode === 'measure') {
                    measurePoints.push(res.point);
                    
                    if(measurePoints.length === 1) {
                        document.getElementById('measureOutput').innerText = 
                            `Point 1 OK. Cliquez sur un 2e point...`;
                    } else if(measurePoints.length === 2) {
                        const d = measurePoints[0].distanceTo(measurePoints[1]);
                        document.getElementById('measureOutput').innerText = 
                            `Distance : ${d.toFixed(2)} unités`;
                        measurePoints = [];
                    }
                }
            }
        });
    }

    function onWindowResize() {
        if (!camera || !renderer) return;
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() { 
        requestAnimationFrame(animate);
        if (controls) controls.update();
        if (renderer && scene && camera) renderer.render(scene, camera);
    }

    // Démarrer quand tout est chargé
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
</script>
</body>
</html>
