<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ASTEC-STEP Viewer Pro</title>
    <style>
        :root { --primary: #2563eb; --panel: rgba(255, 255, 255, 0.95); }
        body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; background: #cbd5e1; }
        #ui { 
            position: absolute; top: 10px; left: 10px; z-index: 100; 
            background: var(--panel); padding: 15px; border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 280px;
            max-height: 90vh; overflow-y: auto;
        }
        h3, h4 { margin: 8px 0; color: #1e293b; border-left: 4px solid var(--primary); padding-left: 8px; }
        hr { border: 0; border-top: 1px solid #ddd; margin: 12px 0; }
        .btn-group { display: flex; flex-direction: column; gap: 6px; }
        button {
            padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; background: white;
            cursor: pointer; transition: 0.2s; text-align: left; font-weight: 500;
        }
        button:hover { background: #f8fafc; border-color: var(--primary); }
        button.active { background: var(--primary); color: white; border-color: var(--primary); }
        #partList { max-height: 200px; overflow-y: auto; background: #fff; border-radius: 6px; border: 1px solid #cbd5e1; margin-top: 5px; }
        .part-item { display: flex; justify-content: space-between; font-size: 11px; padding: 6px; border-bottom: 1px solid #eee; align-items: center; }
        #measureOutput { margin-top: 10px; padding: 10px; background: #1e293b; color: #fbbf24; border-radius: 8px; font-family: monospace; font-size: 12px; min-height: 20px; }
        #status { padding: 10px; border-radius: 8px; font-size: 12px; margin-bottom: 10px; }
        .status-info { background: #dbeafe; color: #1e40af; }
        .status-error { background: #fee2e2; color: #b91c1c; }
        .status-success { background: #dcfce7; color: #166534; }
        .diagnostic { background: #fef3c7; color: #92400e; padding: 12px; border-radius: 8px; font-size: 11px; margin-bottom: 10px; line-height: 1.5; }
        select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; margin-bottom: 5px; }
    </style>
</head>
<body>

<div id="ui">
    <h3>ASTEC-STEP Viewer Pro</h3>
    <div id="status" class="status-info">🔍 Vérification du système...</div>
    <div id="diagnostic"></div>
    <input type="file" id="fileInput" accept=".step,.stp" style="width:100%; margin-bottom: 10px;" disabled>

    <div class="btn-group">
        <button id="btn-view" class="active" onclick="window.setMode('view')">👁️ Vue Libre</button>
        <button id="btn-measure" onclick="window.setMode('measure')">📏 Mesure</button>
        <select id="measureType" onchange="window.resetMeasure()">
            <option value="points">2 Points</option>
            <option value="faces">2 Faces (Distance)</option>
            <option value="center">Entraxe (Cylindres)</option>
            <option value="lines">2 Lignes/Bords</option>
        </select>
        <button id="btn-hide" onclick="window.setMode('hide')">🚫 Masquer au clic</button>
    </div>

    <div id="measureOutput">Mode : Vue libre</div>

    <hr>
    <h4>Transparence globale</h4>
    <input type="range" id="transparencySlider" min="0" max="100" value="100" style="width:100%" oninput="window.updateTransparency(this.value)">

    <hr>
    <h4>Vue en coupe (X)</h4>
    <input type="range" id="clipSlider" min="-100" max="100" value="100" style="width:100%">
    
    <hr>
    <h4>Nomenclature</h4>
    <div id="partList">En attente de modèle...</div>
    
    <button onclick="location.reload()" style="margin-top:15px; width:100%; background:#fee2e2; color:#b91c1c; border:none; padding:12px; font-weight:bold; border-radius:8px; cursor:pointer;">🔄 Réinitialiser</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.145.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/occt-import-js@0.0.12/dist/occt-import-js.js"></script>

<script>
    let scene, camera, renderer, controls, modelGroup, helperGroup;
    let currentMode = 'view', measurePoints = [], selectedObjects = [];
    let clipPlane, occtInstance = null, systemReady = false;

    function showStatus(msg, type = 'info') {
        const statusEl = document.getElementById('status');
        statusEl.textContent = msg;
        statusEl.className = 'status-' + type;
    }

    function showDiagnostic(html) {
        document.getElementById('diagnostic').innerHTML = html;
        document.getElementById('diagnostic').style.display = 'block';
    }

    async function checkSystem() {
        try { new SharedArrayBuffer(1); return true; } catch (e) { return false; }
    }

    async function initOCCT() {
        try {
            occtInstance = await occtimportjs();
            showStatus('✅ Système prêt ! Chargez un fichier STEP', 'success');
            return true;
        } catch (err) {
            showStatus('❌ Erreur OCCT (Headers COOP/COEP manquant)', 'error');
            return false;
        }
    }

    async function init() {
        const sabOK = await checkSystem();
        if (!sabOK) {
            showDiagnostic('<strong>Erreur:</strong> SharedArrayBuffer non disponible. Activez les headers COOP/COEP.');
            return;
        }

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xd1d5db);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 100000);
        camera.position.set(1000, 1000, 1000);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.localClippingEnabled = true;
        document.body.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const light = new THREE.DirectionalLight(0xffffff, 0.6);
        light.position.set(500, 1000, 750);
        scene.add(light);

        modelGroup = new THREE.Group();
        scene.add(modelGroup);
        
        helperGroup = new THREE.Group();
        scene.add(helperGroup);

        clipPlane = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 2000);

        renderer.domElement.addEventListener('pointerdown', (e) => {
            if (currentMode === 'view') return;

            const rect = renderer.domElement.getBoundingClientRect();
            const mouse = new THREE.Vector2(
                ((e.clientX - rect.left) / rect.width) * 2 - 1,
                -((e.clientY - rect.top) / rect.height) * 2 + 1
            );

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(modelGroup.children, true);

            if (intersects.length > 0) {
                const res = intersects[0];

                if (currentMode === 'hide') {
                    res.object.visible = false;
                    updatePartList();
                }

                if (currentMode === 'measure') {
                    handleMeasure(res);
                }
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
        if (await initOCCT()) {
            systemReady = true;
            document.getElementById('fileInput').disabled = false;
        }
    }

    function handleMeasure(intersect) {
        const type = document.getElementById('measureType').value;
        let point = intersect.point.clone();

        // Logique de détection de centre pour "entraxe" ou "faces" circulaires
        if (type === 'center' || type === 'faces') {
            const box = new THREE.Box3().setFromObject(intersect.object);
            const center = new THREE.Vector3();
            box.getCenter(center);
            // Si on cherche l'entraxe, on projette souvent sur le centre de la pièce/face
            if(type === 'center') point = center;
        }

        measurePoints.push(point);
        addVisualPoint(point);

        if (measurePoints.length === 1) {
            document.getElementById('measureOutput').innerText = "Élément 1 OK. Cliquez sur le 2ème...";
        } else if (measurePoints.length === 2) {
            const d = measurePoints[0].distanceTo(measurePoints[1]);
            addVisualLine(measurePoints[0], measurePoints[1]);
            document.getElementById('measureOutput').innerHTML = `<strong>Résultat :</strong> ${d.toFixed(2)} units`;
            measurePoints = [];
        }
    }

    function addVisualPoint(pos) {
        const dot = new THREE.Mesh(
            new THREE.SphereGeometry(2),
            new THREE.MeshBasicMaterial({ color: 0xff0000, depthTest: false })
        );
        dot.position.copy(pos);
        helperGroup.add(dot);
    }

    function addVisualLine(p1, p2) {
        const points = [p1, p2];
        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const line = new THREE.Line(geometry, new THREE.LineBasicMaterial({ color: 0xffff00, linewidth: 2, depthTest: false }));
        helperGroup.add(line);
    }

    window.resetMeasure = () => {
        measurePoints = [];
        helperGroup.clear();
        document.getElementById('measureOutput').innerText = "Mode : Mesure prête";
    };

    window.setMode = (m) => {
        currentMode = m;
        window.resetMeasure();
        document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
        if(document.getElementById('btn-' + m)) document.getElementById('btn-' + m).classList.add('active');
        document.getElementById('measureOutput').innerText = m === 'view' ? 'Mode : Vue libre' : (m === 'hide' ? 'Mode : Masquer' : 'Mode : Mesure');
    };

    window.updateTransparency = (val) => {
        const opacity = val / 100;
        const transparent = opacity < 1;
        modelGroup.traverse(c => { 
            if(c.isMesh) { 
                c.material.transparent = transparent; 
                c.material.opacity = opacity; 
                c.material.needsUpdate = true; 
            } 
        });
    };

    window.togglePart = (index) => {
        const meshes = modelGroup.children.filter(c => c.isMesh);
        if(meshes[index]) { meshes[index].visible = !meshes[index].visible; updatePartList(); }
    };

    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file || !systemReady) return;
        showStatus('⏳ Analyse du modèle...', 'info');
        
        const buffer = await file.arrayBuffer();
        const result = occtInstance.ReadStepFile(new Uint8Array(buffer));

        if (result.success && result.meshes.length > 0) {
            modelGroup.clear();
            helperGroup.clear();
            result.meshes.forEach((mesh, i) => {
                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.Float32BufferAttribute(mesh.attributes.position.array, 3));
                if (mesh.attributes.normal) geo.setAttribute('normal', new THREE.Float32BufferAttribute(mesh.attributes.normal.array, 3));
                if (mesh.index) geo.setIndex(new THREE.Uint32BufferAttribute(mesh.index.array, 1));
                
                const mat = new THREE.MeshPhongMaterial({ color: new THREE.Color().setHSL(i/result.meshes.length, 0.7, 0.5), side: THREE.DoubleSide, clippingPlanes: [clipPlane] });
                const m = new THREE.Mesh(geo, mat);
                m.name = mesh.name || `Pièce ${i+1}`;
                modelGroup.add(m);
            });
            fitCamera();
            updatePartList();
            updateClipBounds();
            showStatus('✅ Modèle chargé', 'success');
        }
    });

    function fitCamera() {
        const box = new THREE.Box3().setFromObject(modelGroup);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        controls.target.copy(center);
        camera.position.set(center.x + size.x, center.y + size.y, center.z + size.z);
        controls.update();
    }

    function updatePartList() {
        const list = document.getElementById('partList');
        list.innerHTML = '';
        modelGroup.children.filter(c => c.isMesh).forEach((m, i) => {
            const div = document.createElement('div');
            div.className = 'part-item';
            div.style.background = m.visible ? "transparent" : "#fee2e2";
            div.innerHTML = `<span>${m.name}</span><button onclick="window.togglePart(${i})">${m.visible ? '👁️' : '❌'}</button>`;
            list.appendChild(div);
        });
    }

    function updateClipBounds() {
        const box = new THREE.Box3().setFromObject(modelGroup);
        const s = document.getElementById('clipSlider');
        s.min = box.min.x; s.max = box.max.x; s.value = box.max.x;
        clipPlane.constant = box.max.x;
    }

    document.getElementById('clipSlider').addEventListener('input', (e) => clipPlane.constant = parseFloat(e.target.value));
    function animate() { requestAnimationFrame(animate); if(controls) controls.update(); renderer.render(scene, camera); }
    init();
</script>
</body>
</html>
