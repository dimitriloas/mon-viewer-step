<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STEP Viewer Pro</title>
    <style>
        :root { --primary: #2563eb; --bg: #f1f5f9; --panel: rgba(255, 255, 255, 0.95); }
        body { margin: 0; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; background: #cbd5e1; }
        #ui { 
            position: absolute; top: 10px; left: 10px; z-index: 100; 
            background: var(--panel); padding: 15px; border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 280px;
            max-height: 90vh; overflow-y: auto;
        }
        h3, h4 { margin: 8px 0; color: #1e293b; border-left: 4px solid var(--primary); padding-left: 8px; }
        hr { border: 0; border-top: 1px solid #ddd; margin: 12px 0; }
        .btn-group { display: flex; flex-direction: column; gap: 6px; }
        button {
            padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; background: white;
            cursor: pointer; transition: 0.2s; text-align: left; font-weight: 500;
        }
        button:hover { background: #f8fafc; border-color: var(--primary); }
        button.active { background: var(--primary); color: white; border-color: var(--primary); }
        #partList { max-height: 200px; overflow-y: auto; background: #fff; border-radius: 6px; border: 1px solid #cbd5e1; margin-top: 5px; }
        .part-item { display: flex; justify-content: space-between; font-size: 11px; padding: 6px; border-bottom: 1px solid #eee; align-items: center; }
        #measureOutput { margin-top: 10px; padding: 10px; background: #1e293b; color: #fbbf24; border-radius: 8px; font-family: monospace; font-size: 12px; }
        #status { color: var(--primary); font-weight: bold; font-size: 13px; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>

<div id="ui">
    <h3>STEP Viewer Pro</h3>
    <input type="file" id="fileInput" accept=".step,.stp" style="width:100%; margin-bottom: 10px;">
    <div id="status">Chargement...</div>

    <div class="btn-group">
        <button id="btn-view" class="active" onclick="window.setMode('view')">👁️ Vue Libre</button>
        <button id="btn-measure" onclick="window.setMode('measure')">📏 Mesurer (2 pts)</button>
        <button id="btn-hide" onclick="window.setMode('hide')">🚫 Masquer au clic</button>
        <button onclick="window.toggleTransparency()">👻 Transparence On/Off</button>
    </div>

    <div id="measureOutput">Mode : Vue libre</div>

    <hr>
    <h4>Vue en coupe (X)</h4>
    <input type="range" id="clipSlider" min="-100" max="100" value="100" style="width:100%">
    
    <hr>
    <h4>Nomenclature</h4>
    <div id="partList"></div>
    
    <button onclick="location.reload()" style="margin-top:15px; width:100%; background:#fee2e2; color:#b91c1c; border:none; padding:12px; font-weight:bold;">🔄 Réinitialiser</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/occt-import-js@0.0.12/dist/occt-import-js.js"></script>

<script>
    // Variables globales
    let scene, camera, renderer, controls, modelGroup;
    let currentMode = 'view', measurePoints = [], isTransparent = false;
    let clipPlane = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 1000);

    // Initialisation au chargement de la fenêtre
    window.onload = init;

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xd1d5db);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 50000);
        camera.position.set(600, 600, 600);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.localClippingEnabled = true;
        document.body.appendChild(renderer.domElement);

        // OrbitControls version standard
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        scene.add(new THREE.AmbientLight(0xffffff, 0.9));
        const light = new THREE.DirectionalLight(0xffffff, 0.6);
        light.position.set(200, 400, 300);
        scene.add(light);

        modelGroup = new THREE.Group();
        scene.add(modelGroup);

        window.addEventListener('resize', onWindowResize);
        animate();
    }

    // Fonctions UI accessibles globalement
    window.setMode = (m) => {
        currentMode = m;
        measurePoints = [];
        document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
        const btn = document.getElementById('btn-' + m);
        if(btn) btn.classList.add('active');
        document.getElementById('measureOutput').innerText = `Mode : ${m}`;
    };

    window.toggleTransparency = () => {
        isTransparent = !isTransparent;
        modelGroup.traverse(c => { 
            if(c.isMesh) { 
                c.material.transparent = isTransparent; 
                c.material.opacity = isTransparent ? 0.3 : 1.0; 
                c.material.needsUpdate = true;
            }
        });
    };

    window.togglePart = (index) => {
        const part = modelGroup.children[index];
        if(part) {
            part.visible = !part.visible;
            updatePartList();
        }
    };

    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        const statusEl = document.getElementById('status');
        statusEl.style.display = 'block';
        statusEl.innerText = "Lecture du STEP...";
        
        try {
            // Initialisation du moteur occt-import-js (version CDN globale)
            const occt = await occtimportjs(); 
            const buffer = await file.arrayBuffer();
            const result = occt.ReadStepFile(new Uint8Array(buffer), null);

            modelGroup.clear();
            if(result && result.meshes) {
                result.meshes.forEach((mesh, i) => {
                    const geo = new THREE.BufferGeometry();
                    geo.setAttribute('position', new THREE.Float32BufferAttribute(mesh.attributes.position.array, 3));
                    if (mesh.attributes.normal) geo.setAttribute('normal', new THREE.Float32BufferAttribute(mesh.attributes.normal.array, 3));
                    geo.setIndex(new THREE.Uint32BufferAttribute(mesh.index.array, 1));
                    
                    const mat = new THREE.MeshPhongMaterial({ 
                        color: 0x475569, 
                        side: THREE.DoubleSide,
                        clippingPlanes: [clipPlane]
                    });
                    
                    const m = new THREE.Mesh(geo, mat);
                    m.name = `Pièce ${i+1}`;
                    modelGroup.add(m);
                });
                
                fitCamera();
                updatePartList();
                updateClipBounds();
            }
        } catch (err) {
            console.error(err);
            alert("Erreur technique. Essayez un fichier STEP plus petit.");
        }
        statusEl.style.display = 'none';
    });

    function fitCamera() {
        const box = new THREE.Box3().setFromObject(modelGroup);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        controls.target.copy(center);
        camera.position.set(center.x + maxDim, center.y + maxDim, center.z + maxDim);
        controls.update();
    }

    function updatePartList() {
        const list = document.getElementById('partList');
        list.innerHTML = '';
        modelGroup.children.forEach((m, i) => {
            const div = document.createElement('div');
            div.className = 'part-item';
            div.style.background = m.visible ? "transparent" : "#fee2e2";
            div.innerHTML = `<span>${m.name}</span><button onclick="window.togglePart(${i})">${m.visible ? '👁️' : '❌'}</button>`;
            list.appendChild(div);
        });
    }

    function updateClipBounds() {
        const box = new THREE.Box3().setFromObject(modelGroup);
        const s = document.getElementById('clipSlider');
        s.min = box.min.x - 5; 
        s.max = box.max.x + 5; 
        s.value = box.max + 5;
        clipPlane.constant = s.value;
    }

    document.getElementById('clipSlider').addEventListener('input', (e) => {
        clipPlane.constant = parseFloat(e.target.value);
    });

    renderer.domElement.addEventListener('mousedown', (e) => {
        if(currentMode === 'view') return;
        const rect = renderer.domElement.getBoundingClientRect();
        const mouse = new THREE.Vector2(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(modelGroup.children);
        
        if(intersects.length > 0) {
            const res = intersects[0];
            if(currentMode === 'hide') {
                res.object.visible = false;
                updatePartList();
            }
            if(currentMode === 'measure') {
                measurePoints.push(res.point);
                if(measurePoints.length === 2) {
                    const d = measurePoints[0].distanceTo(measurePoints[1]);
                    document.getElementById('measureOutput').innerText = `Distance : ${d.toFixed(2)} mm`;
                    measurePoints = [];
                }
            }
        }
    });

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() { 
        requestAnimationFrame(animate); 
        controls.update(); 
        renderer.render(scene, camera); 
    }
</script>
</body>
</html>
