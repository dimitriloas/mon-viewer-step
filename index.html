<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ASTEC Hybrid Viewer</title>
    <style>
        :root { --primary: #2563eb; --panel: rgba(255, 255, 255, 0.95); }
        body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; background: #cbd5e1; }
        
        /* Système d'onglets */
        .tabs { display: flex; background: #1e293b; padding: 5px 5px 0; gap: 5px; }
        .tab { 
            padding: 10px 20px; color: white; cursor: pointer; border-radius: 8px 8px 0 0;
            background: rgba(255,255,255,0.1); font-weight: bold; transition: 0.2s;
        }
        .tab.active { background: var(--panel); color: var(--primary); }

        #ui { 
            position: absolute; top: 60px; left: 10px; z-index: 100; 
            background: var(--panel); padding: 15px; border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 280px;
            max-height: 85vh; overflow-y: auto;
        }
        
        .content-3d, .content-2d { display: none; height: calc(100vh - 45px); width: 100%; }
        .active-content { display: block; }

        canvas { display: block; }
        #pdf-viewer { width: 100%; height: 100%; border: none; background: white; }

        .btn-group { display: flex; flex-direction: column; gap: 6px; }
        button {
            padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; background: white;
            cursor: pointer; transition: 0.2s; text-align: left; font-weight: 500;
        }
        button.active { background: var(--primary); color: white; }
        #status { padding: 10px; border-radius: 8px; font-size: 12px; margin-bottom: 10px; background: #dbeafe; color: #1e40af; }
    </style>
</head>
<body>

<div class="tabs">
    <div class="tab active" onclick="switchTab('3d')">📦 Modèle 3D (STEP)</div>
    <div class="tab" onclick="switchTab('2d')">📄 Plan 2D (DXF/DWG/PDF)</div>
</div>

<div id="ui">
    <div id="status">🚀 Prêt pour analyse</div>
    
    <div id="controls-3d">
        <h4>Outils 3D</h4>
        <input type="file" id="stepInput" accept=".step,.stp" style="width:100%; margin-bottom:10px;">
        <div class="btn-group">
            <button onclick="window.setMode('view')" class="active" id="btn-view">👁️ Vue Libre</button>
            <button onclick="window.setMode('measure')" id="btn-measure">📏 Mesurer</button>
            <button onclick="window.toggleTransparency()">👻 Transparence</button>
        </div>
        <hr>
        <div id="partList" style="font-size:11px;">Nomenclature...</div>
    </div>

    <div id="controls-2d" style="display:none;">
        <h4>Outils 2D</h4>
        <p style="font-size:11px; color:#64748b;">Note: Pour DWG/DXF, la conversion PDF garantit l'affichage du logo.</p>
        <input type="file" id="pdfInput" accept=".pdf,.dxf" style="width:100%; margin-bottom:10px;">
        <button onclick="window.printPlan()" style="width:100%;">🖨️ Imprimer le plan</button>
    </div>

    <button onclick="location.reload()" style="margin-top:15px; width:100%; background:#fee2e2; color:#b91c1c; border:none; padding:12px; font-weight:bold; border-radius:8px; cursor:pointer;">🔄 Réinitialiser</button>
</div>

<div id="container-3d" class="content-3d active-content"></div>
<div id="container-2d" class="content-2d">
    <iframe id="pdfFrame" style="width:100%; height:100%; border:none;"></iframe>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.145.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/occt-import-js@0.0.12/dist/occt-import-js.js"></script>

<script>
    let scene, camera, renderer, controls, modelGroup, occtInstance;
    let currentMode = 'view';

    // --- LOGIQUE DES ONGLETS ---
    function switchTab(type) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.content-3d, .content-2d').forEach(c => c.classList.remove('active-content'));
        
        if(type === '3d') {
            document.querySelector('.tab:nth-child(1)').classList.add('active');
            document.getElementById('container-3d').classList.add('active-content');
            document.getElementById('controls-3d').style.display = 'block';
            document.getElementById('controls-2d').style.display = 'none';
        } else {
            document.querySelector('.tab:nth-child(2)').classList.add('active');
            document.getElementById('container-2d').classList.add('active-content');
            document.getElementById('controls-3d').style.display = 'none';
            document.getElementById('controls-2d').style.display = 'block';
        }
    }

    // --- INITIALISATION 3D ---
    async function init3D() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xd1d5db);
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 100000);
        camera.position.set(500, 500, 500);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('container-3d').appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        
        modelGroup = new THREE.Group();
        scene.add(modelGroup);

        occtInstance = await occtimportjs();
        animate();
    }

    // --- CHARGEMENT STEP (3D) ---
    document.getElementById('stepInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        const buffer = await file.arrayBuffer();
        const result = occtInstance.ReadStepFile(new Uint8Array(buffer));
        if (result.success) {
            modelGroup.clear();
            result.meshes.forEach((mesh, i) => {
                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.Float32BufferAttribute(mesh.attributes.position.array, 3));
                const mat = new THREE.MeshPhongMaterial({ color: new THREE.Color().setHSL(i/result.meshes.length, 0.6, 0.5) });
                modelGroup.add(new THREE.Mesh(geo, mat));
            });
            fitCamera();
            document.getElementById('status').textContent = "✅ 3D Chargé";
        }
    });

    // --- CHARGEMENT PDF/DXF (2D) ---
    document.getElementById('pdfInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            // Conversion visuelle : on utilise l'URL d'objet pour le rendu navigateur
            const fileURL = URL.createObjectURL(file);
            document.getElementById('pdfFrame').src = fileURL;
            document.getElementById('status').textContent = "✅ Plan 2D prêt";
        }
    });

    function fitCamera() {
        const box = new THREE.Box3().setFromObject(modelGroup);
        const center = box.getCenter(new THREE.Vector3());
        controls.target.copy(center);
        controls.update();
    }

    function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
    init3D();
</script>
</body>
</html>
