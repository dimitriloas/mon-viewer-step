<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STEP Viewer Pro</title>
    <style>
        :root { --primary: #2563eb; --panel: rgba(255, 255, 255, 0.95); }
        body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; background: #cbd5e1; }
        #ui { 
            position: absolute; top: 10px; left: 10px; z-index: 100; 
            background: var(--panel); padding: 15px; border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 280px;
            max-height: 90vh; overflow-y: auto;
        }
        h3, h4 { margin: 8px 0; color: #1e293b; border-left: 4px solid var(--primary); padding-left: 8px; }
        hr { border: 0; border-top: 1px solid #ddd; margin: 12px 0; }
        .btn-group { display: flex; flex-direction: column; gap: 6px; }
        button {
            padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; background: white;
            cursor: pointer; transition: 0.2s; text-align: left; font-weight: 500;
        }
        button:hover { background: #f8fafc; border-color: var(--primary); }
        button.active { background: var(--primary); color: white; border-color: var(--primary); }
        #partList { max-height: 200px; overflow-y: auto; background: #fff; border-radius: 6px; border: 1px solid #cbd5e1; margin-top: 5px; }
        .part-item { display: flex; justify-content: space-between; font-size: 11px; padding: 6px; border-bottom: 1px solid #eee; align-items: center; }
        #measureOutput { margin-top: 10px; padding: 10px; background: #1e293b; color: #fbbf24; border-radius: 8px; font-family: monospace; font-size: 12px; min-height: 20px; }
        #status { padding: 10px; background: #dbeafe; color: #1e40af; border-radius: 8px; font-size: 12px; margin-bottom: 10px; display: none; }
        #error { padding: 10px; background: #fee2e2; color: #b91c1c; border-radius: 8px; font-size: 11px; margin-bottom: 10px; display: none; }
        .warning { background: #fef3c7; color: #92400e; padding: 10px; border-radius: 8px; font-size: 11px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="ui">
    <h3>STEP Viewer Pro</h3>
    
    <div id="error"></div>
    <div id="status">Initialisation...</div>
    
    <div class="warning" id="coopWarning" style="display: none;">
        ⚠️ Configuration COOP/COEP manquante. Hébergez sur un serveur avec les en-têtes appropriés.
    </div>
    
    <input type="file" id="fileInput" accept=".step,.stp" style="width:100%; margin-bottom: 10px;">

    <div class="btn-group">
        <button id="btn-view" class="active" onclick="window.setMode('view')">👁️ Vue Libre</button>
        <button id="btn-measure" onclick="window.setMode('measure')">📏 Mesurer (2 pts)</button>
        <button id="btn-hide" onclick="window.setMode('hide')">🚫 Masquer au clic</button>
        <button onclick="window.toggleTransparency()">👻 Transparence</button>
    </div>

    <div id="measureOutput">Mode : Vue libre</div>

    <hr>
    <h4>Vue en coupe (X)</h4>
    <input type="range" id="clipSlider" min="-100" max="100" value="100" style="width:100%">
    
    <hr>
    <h4>Nomenclature</h4>
    <div id="partList">Aucun modèle chargé</div>
    
    <button onclick="location.reload()" style="margin-top:15px; width:100%; background:#fee2e2; color:#b91c1c; border:none; padding:12px; font-weight:bold; border-radius:8px; cursor:pointer;">🔄 Réinitialiser</button>
</div>

<script src="https://unpkg.com/three@0.145.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.145.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/occt-import-js@0.0.12/dist/occt-import-js.js"></script>

<script>
    let scene, camera, renderer, controls, modelGroup;
    let currentMode = 'view', measurePoints = [], isTransparent = false;
    let clipPlane = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 2000);
    let occtInstance = null;

    function showStatus(msg, isError = false) {
        const statusEl = document.getElementById('status');
        const errorEl = document.getElementById('error');
        
        if (isError) {
            errorEl.innerText = msg;
            errorEl.style.display = 'block';
            statusEl.style.display = 'none';
        } else {
            statusEl.innerText = msg;
            statusEl.style.display = 'block';
            errorEl.style.display = 'none';
        }
    }

    function hideStatus() {
        document.getElementById('status').style.display = 'none';
        document.getElementById('error').style.display = 'none';
    }

    async function checkCOOPCOEP() {
        try {
            const buffer = new SharedArrayBuffer(1);
            return true;
        } catch (e) {
            document.getElementById('coopWarning').style.display = 'block';
            console.warn('COOP/COEP non configuré:', e);
            return false;
        }
    }

    async function initOCCT() {
        showStatus('Chargement de la bibliothèque OCCT...');
        try {
            if (typeof occtimportjs === 'undefined') {
                throw new Error('occt-import-js non chargé');
            }
            
            occtInstance = await occtimportjs();
            console.log('OCCT initialisé avec succès');
            hideStatus();
            return true;
        } catch (err) {
            console.error('Erreur d\'initialisation OCCT:', err);
            showStatus('❌ Erreur: ' + err.message + '. Vérifiez la configuration COOP/COEP.', true);
            return false;
        }
    }

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xd1d5db);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 100000);
        camera.position.set(1000, 1000, 1000);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.localClippingEnabled = true;
        document.body.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const light = new THREE.DirectionalLight(0xffffff, 0.6);
        light.position.set(500, 1000, 750);
        scene.add(light);

        const light2 = new THREE.DirectionalLight(0xffffff, 0.4);
        light2.position.set(-500, -1000, -750);
        scene.add(light2);

        modelGroup = new THREE.Group();
        scene.add(modelGroup);

        // Axes de référence
        const axesHelper = new THREE.AxesHelper(100);
        scene.add(axesHelper);

        window.addEventListener('resize', onWindowResize);
        animate();

        // Vérifier COOP/COEP et initialiser OCCT
        checkCOOPCOEP();
        initOCCT();
    }

    window.setMode = (m) => {
        currentMode = m;
        measurePoints = [];
        document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
        const btn = document.getElementById('btn-' + m);
        if(btn) btn.classList.add('active');
        
        const modeNames = {
            'view': 'Vue libre',
            'measure': 'Mesure (cliquez 2 points)',
            'hide': 'Masquer au clic'
        };
        document.getElementById('measureOutput').innerText = `Mode : ${modeNames[m] || m}`;
    };

    window.toggleTransparency = () => {
        isTransparent = !isTransparent;
        modelGroup.traverse(c => { 
            if(c.isMesh) { 
                c.material.transparent = isTransparent; 
                c.material.opacity = isTransparent ? 0.3 : 1.0;
                c.material.depthWrite = !isTransparent;
                c.material.needsUpdate = true;
            }
        });
    };

    window.togglePart = (index) => {
        const part = modelGroup.children.find((c, i) => c.isMesh && i === index);
        if(part) {
            part.visible = !part.visible;
            updatePartList();
        }
    };

    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        showStatus('Lecture du fichier...');
        
        try {
            // Vérifier que OCCT est initialisé
            if (!occtInstance) {
                const success = await initOCCT();
                if (!success) {
                    return;
                }
            }

            showStatus('Analyse du modèle 3D...');
            
            const buffer = await file.arrayBuffer();
            console.log('Fichier chargé:', file.name, 'Taille:', buffer.byteLength);
            
            const fileData = new Uint8Array(buffer);
            const result = occtInstance.ReadStepFile(fileData);

            console.log('Résultat OCCT:', result);

            if (result && result.success && result.meshes && result.meshes.length > 0) {
                showStatus(`Création de ${result.meshes.length} pièce(s)...`);
                
                modelGroup.clear();
                
                result.meshes.forEach((mesh, i) => {
                    try {
                        const geo = new THREE.BufferGeometry();
                        
                        // Vérifier que les données existent
                        if (!mesh.attributes || !mesh.attributes.position) {
                            console.warn(`Mesh ${i} sans données de position`);
                            return;
                        }
                        
                        geo.setAttribute('position', new THREE.Float32BufferAttribute(mesh.attributes.position.array, 3));
                        
                        if (mesh.attributes.normal) {
                            geo.setAttribute('normal', new THREE.Float32BufferAttribute(mesh.attributes.normal.array, 3));
                        } else {
                            geo.computeVertexNormals();
                        }
                        
                        if (mesh.index) {
                            geo.setIndex(new THREE.Uint32BufferAttribute(mesh.index.array, 1));
                        }
                        
                        // Couleur aléatoire pour chaque pièce
                        const color = new THREE.Color().setHSL(i / result.meshes.length, 0.7, 0.5);
                        
                        const mat = new THREE.MeshPhongMaterial({ 
                            color: color, 
                            side: THREE.DoubleSide,
                            clippingPlanes: [clipPlane],
                            flatShading: false
                        });
                        
                        const m = new THREE.Mesh(geo, mat);
                        m.name = mesh.name || `Pièce ${i+1}`;
                        modelGroup.add(m);
                        
                        console.log(`Mesh ${i} ajouté:`, m.name, 'Vertices:', mesh.attributes.position.array.length / 3);
                    } catch (err) {
                        console.error(`Erreur lors de la création du mesh ${i}:`, err);
                    }
                });
                
                if (modelGroup.children.length > 0) {
                    fitCamera();
                    updatePartList();
                    updateClipBounds();
                    hideStatus();
                    console.log('Modèle chargé avec succès');
                } else {
                    showStatus('❌ Aucune géométrie valide trouvée dans le fichier', true);
                }
            } else {
                const errorMsg = result?.success === false ? 
                    'Le fichier STEP ne peut pas être lu ou est corrompu' : 
                    'Format de fichier non reconnu';
                showStatus('❌ ' + errorMsg, true);
                console.error('Échec du chargement:', result);
            }
        } catch (err) {
            console.error('Erreur complète:', err);
            showStatus('❌ Erreur: ' + err.message, true);
        }
    });

    function fitCamera() {
        const box = new THREE.Box3().setFromObject(modelGroup);
        if (box.isEmpty()) {
            console.warn('Boîte englobante vide');
            return;
        }
        
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        
        controls.target.copy(center);
        const distance = maxDim * 2;
        camera.position.set(
            center.x + distance * 0.7,
            center.y + distance * 0.7,
            center.z + distance * 0.7
        );
        camera.lookAt(center);
        controls.update();
        
        console.log('Caméra ajustée - Centre:', center, 'Taille:', size);
    }

    function updatePartList() {
        const list = document.getElementById('partList');
        list.innerHTML = '';
        
        if (modelGroup.children.length === 0) {
            list.innerHTML = '<div class="part-item">Aucun modèle chargé</div>';
            return;
        }
        
        modelGroup.children.forEach((m, i) => {
            if (!m.isMesh) return;
            
            const div = document.createElement('div');
            div.className = 'part-item';
            div.style.background = m.visible ? "transparent" : "#fee2e2";
            
            const btn = document.createElement('button');
            btn.textContent = m.visible ? '👁️' : '❌';
            btn.style.cssText = 'padding: 4px 8px; font-size: 14px;';
            btn.onclick = () => window.togglePart(i);
            
            const span = document.createElement('span');
            span.textContent = m.name;
            
            div.appendChild(span);
            div.appendChild(btn);
            list.appendChild(div);
        });
    }

    function updateClipBounds() {
        const box = new THREE.Box3().setFromObject(modelGroup);
        if (box.isEmpty()) return;
        
        const s = document.getElementById('clipSlider');
        s.min = Math.floor(box.min.x - 10);
        s.max = Math.ceil(box.max.x + 10);
        s.value = s.max;
        clipPlane.constant = parseFloat(s.value);
    }

    document.getElementById('clipSlider').addEventListener('input', (e) => {
        clipPlane.constant = parseFloat(e.target.value);
    });

    renderer.domElement.addEventListener('mousedown', (e) => {
        if(currentMode === 'view') return;
        
        const rect = renderer.domElement.getBoundingClientRect();
        const mouse = new THREE.Vector2(
            ((e.clientX - rect.left) / rect.width) * 2 - 1,
            -((e.clientY - rect.top) / rect.height) * 2 + 1
        );
        
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(modelGroup.children, false);
        
        if(intersects.length > 0) {
            const res = intersects[0];
            
            if(currentMode === 'hide') {
                res.object.visible = false;
                updatePartList();
            }
            
            if(currentMode === 'measure') {
                measurePoints.push(res.point);
                
                if(measurePoints.length === 1) {
                    document.getElementById('measureOutput').innerText = 
                        `Point 1 sélectionné. Cliquez sur un 2e point...`;
                } else if(measurePoints.length === 2) {
                    const d = measurePoints[0].distanceTo(measurePoints[1]);
                    document.getElementById('measureOutput').innerText = 
                        `Distance : ${d.toFixed(2)} unités`;
                    measurePoints = [];
                }
            }
        }
    });

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() { 
        requestAnimationFrame(animate); 
        controls.update(); 
        renderer.render(scene, camera); 
    }

    init();
</script>
</body>
</html>
