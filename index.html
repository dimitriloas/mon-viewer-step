<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ASTEC-CAD Viewer Pro</title>
    <style>
        :root { --primary: #2563eb; --panel: rgba(255, 255, 255, 0.95); }
        body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; background: #f1f5f9; transition: background 0.3s; }
        #ui { 
            position: absolute; top: 10px; left: 10px; z-index: 100; 
            background: var(--panel); padding: 15px; border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 280px;
            max-height: 90vh; overflow-y: auto;
        }
        h3, h4 { margin: 8px 0; color: #1e293b; border-left: 4px solid var(--primary); padding-left: 8px; }
        hr { border: 0; border-top: 1px solid #ddd; margin: 12px 0; }
        .btn-group { display: flex; flex-direction: column; gap: 6px; }
        button {
            padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; background: white;
            cursor: pointer; transition: 0.2s; text-align: left; font-weight: 500;
        }
        button:hover { background: #f8fafc; border-color: var(--primary); }
        button.active { background: var(--primary); color: white; border-color: var(--primary); }
        #partList { max-height: 200px; overflow-y: auto; background: #fff; border-radius: 6px; border: 1px solid #cbd5e1; margin-top: 5px; }
        .part-item { display: flex; justify-content: space-between; font-size: 11px; padding: 6px; border-bottom: 1px solid #eee; align-items: center; }
        #measureOutput { margin-top: 10px; padding: 10px; background: #1e293b; color: #fbbf24; border-radius: 8px; font-family: monospace; font-size: 12px; min-height: 20px; }
        #status { padding: 10px; border-radius: 8px; font-size: 12px; margin-bottom: 10px; }
        .status-info { background: #dbeafe; color: #1e40af; }
        .status-error { background: #fee2e2; color: #b91c1c; }
        .status-success { background: #dcfce7; color: #166534; }
        .theme-toggle { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
        .theme-btn { flex: 1; font-size: 10px; text-align: center; padding: 6px; border-radius: 6px; border: 1px solid #ddd; cursor: pointer; min-width: 80px; }
        .contrast-btn { background: #1e293b; color: white; width: 100%; margin-top: 5px; }
    </style>
</head>
<body>

<div id="ui">
    <h3>ASTEC-CAD Viewer Pro</h3>
    <div id="status" class="status-info">🔍 Initialisation...</div>
    <input type="file" id="fileInput" accept=".step,.stp,.dxf" style="width:100%; margin-bottom: 10px;" disabled>

    <div class="btn-group">
        <button id="btn-view" class="active" onclick="window.setMode('view')">👁️ Navigation</button>
        <button id="btn-measure" onclick="window.setMode('measure')">📏 Mesurer</button>
        <select id="measureType" style="width:100%; padding:8px; margin-top:4px; border-radius:8px; border:1px solid #cbd5e1;" onchange="window.resetMeasure()">
            <option value="points">2 Points</option>
            <option value="center">Entraxe (Cercles)</option>
        </select>
        <button id="btn-hide" onclick="window.setMode('hide')">🚫 Masquer l'élément</button>
    </div>

    <div id="measureOutput">Mode : Navigation</div>

    <div class="theme-toggle">
        <button class="theme-btn" onclick="setTheme('#f1f5f9', '#334155')">☀️ Jour</button>
        <button class="theme-btn" onclick="setTheme('#1e293b', '#cbd5e1')">🌙 Nuit</button>
        <button class="theme-btn contrast-btn" onclick="autoContrast()">🌓 Contraste Auto</button>
    </div>

    <hr>
    <h4>Transparence (STEP)</h4>
    <input type="range" id="transparencySlider" min="10" max="100" value="100" style="width:100%" oninput="window.updateTransparency(this.value)">

    <hr>
    <h4>Composants / Calques</h4>
    <div id="partList">En attente de fichier...</div>
    
    <button onclick="location.reload()" style="margin-top:15px; width:100%; background:#fee2e2; color:#b91c1c; border:none; padding:12px; font-weight:bold; border-radius:8px; cursor:pointer;">🔄 Réinitialiser</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.145.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/occt-import-js@0.0.12/dist/occt-import-js.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dxf-parser@1.1.2/dist/dxf-parser.min.js"></script>

<script>
    let scene, camera, renderer, controls, modelGroup, helperGroup;
    let currentMode = 'view', measurePoints = [], currentLineColor = 0x334155;
    let occtInstance = null, systemReady = false;

    function showStatus(msg, type = 'info') {
        const el = document.getElementById('status');
        el.textContent = msg; el.className = 'status-' + type;
    }

    function setTheme(bg, line) {
        scene.background = new THREE.Color(bg);
        document.body.style.background = bg;
        currentLineColor = new THREE.Color(line);
        applyLineColor(currentLineColor);
    }

    function autoContrast() {
        const bgColor = scene.background;
        // Calcul de luminance pour choisir entre noir et blanc
        const luminance = (0.299 * bgColor.r + 0.587 * bgColor.g + 0.114 * bgColor.b);
        currentLineColor = luminance > 0.5 ? new THREE.Color(0x000000) : new THREE.Color(0xffffff);
        applyLineColor(currentLineColor);
    }

    function applyLineColor(color) {
        modelGroup.traverse(c => { 
            if (c.isLine) {
                c.material.color.set(color);
                c.material.needsUpdate = true;
            }
        });
    }

    async function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf1f5f9);
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000000);
        camera.position.set(0, 0, 1000);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        scene.add(new THREE.AmbientLight(0xffffff, 1.2));

        modelGroup = new THREE.Group();
        helperGroup = new THREE.Group();
        scene.add(modelGroup, helperGroup);

        renderer.domElement.addEventListener('pointerdown', handleInteraction);

        try {
            occtInstance = await occtimportjs();
            systemReady = true;
            document.getElementById('fileInput').disabled = false;
            showStatus('✅ Prêt', 'success');
        } catch (e) { showStatus('❌ Erreur SharedArrayBuffer', 'error'); }

        animate();
    }

    function handleInteraction(e) {
        if (currentMode === 'view') return;
        const rect = renderer.domElement.getBoundingClientRect();
        const mouse = new THREE.Vector2(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
        const raycaster = new THREE.Raycaster();
        raycaster.params.Line.threshold = 5; 
        raycaster.setFromCamera(mouse, camera);
        
        const intersects = raycaster.intersectObjects(modelGroup.children, true);

        if (intersects.length > 0) {
            const res = intersects[0];
            if (currentMode === 'hide') {
                res.object.visible = false;
                updatePartList();
            } else if (currentMode === 'measure') {
                let p = res.point.clone();
                if (document.getElementById('measureType').value === 'center') {
                    const box = new THREE.Box3().setFromObject(res.object);
                    box.getCenter(p);
                }
                measurePoints.push(p);
                addVisualPoint(p);
                if (measurePoints.length === 2) {
                    const d = measurePoints[0].distanceTo(measurePoints[1]);
                    addVisualLine(measurePoints[0], measurePoints[1]);
                    document.getElementById('measureOutput').innerHTML = `<strong>Dist :</strong> ${d.toFixed(2)} units`;
                    measurePoints = [];
                }
            }
        }
    }

    function addVisualPoint(pos) {
        const dot = new THREE.Mesh(new THREE.SphereGeometry(2), new THREE.MeshBasicMaterial({color: 0xff0000, depthTest: false}));
        dot.position.copy(pos);
        helperGroup.add(dot);
    }

    function addVisualLine(p1, p2) {
        const geom = new THREE.BufferGeometry().setFromPoints([p1, p2]);
        helperGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({color: 0x2563eb, depthTest: false})));
    }

    window.resetMeasure = () => { helperGroup.clear(); measurePoints = []; };
    window.setMode = (m) => {
        currentMode = m; window.resetMeasure();
        document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
        if(document.getElementById('btn-'+m)) document.getElementById('btn-'+m).classList.add('active');
    };

    window.updateTransparency = (v) => {
        const op = v / 100;
        modelGroup.traverse(m => { if(m.isMesh) { m.material.transparent = op < 1; m.material.opacity = op; }});
    };

    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        modelGroup.clear(); helperGroup.clear();
        const ext = file.name.split('.').pop().toLowerCase();
        if (ext === 'dxf') loadDXF(file); else loadSTEP(file);
    });

    async function loadDXF(file) {
        showStatus('⏳ Lecture DXF...', 'info');
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const dxf = new DxfParser().parseSync(e.target.result);
                dxf.entities.forEach(ent => {
                    let pts = [];
                    if (ent.type === 'LINE') pts = [ent.start, ent.end];
                    else if (ent.type === 'LWPOLYLINE' || ent.type === 'POLYLINE') pts = ent.vertices;
                    
                    if (pts.length > 0) {
                        const v3 = pts.map(v => new THREE.Vector3(v.x, v.y, 0));
                        const geo = new THREE.BufferGeometry().setFromPoints(v3);
                        modelGroup.add(new THREE.Line(geo, new THREE.LineBasicMaterial({color: currentLineColor})));
                    } else if (ent.type === 'CIRCLE' || ent.type === 'ARC') {
                        const curve = new THREE.ArcCurve(ent.center.x, ent.center.y, ent.radius, ent.startAngle || 0, ent.endAngle || 2*Math.PI);
                        modelGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(50)), new THREE.LineBasicMaterial({color: currentLineColor})));
                    }
                });
                finalizeLoad(true);
            } catch (err) { showStatus('❌ DXF trop complexe ou binaire', 'error'); }
        };
        reader.readAsText(file);
    }

    async function loadSTEP(file) {
        showStatus('⏳ Lecture STEP...', 'info');
        const buffer = await file.arrayBuffer();
        const result = occtInstance.ReadStepFile(new Uint8Array(buffer));
        if (result.success) {
            result.meshes.forEach((mesh, i) => {
                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.Float32BufferAttribute(mesh.attributes.position.array, 3));
                if (mesh.attributes.normal) geo.setAttribute('normal', new THREE.Float32BufferAttribute(mesh.attributes.normal.array, 3));
                if (mesh.index) geo.setIndex(new THREE.Uint32BufferAttribute(mesh.index.array, 1));
                modelGroup.add(new THREE.Mesh(geo, new THREE.MeshPhongMaterial({ color: new THREE.Color().setHSL(i/result.meshes.length, 0.5, 0.5) })));
            });
            finalizeLoad(false);
        }
    }

    function finalizeLoad(is2D) {
        const box = new THREE.Box3().setFromObject(modelGroup);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        controls.target.copy(center);
        if(is2D) {
            controls.enableRotate = false;
            camera.position.set(center.x, center.y, Math.max(size.x, size.y) * 1.5);
        } else {
            controls.enableRotate = true;
            camera.position.set(center.x + size.x, center.y + size.y, center.z + size.z);
        }
        controls.update();
        updatePartList();
        showStatus('✅ Chargé', 'success');
    }

    function updatePartList() {
        const list = document.getElementById('partList');
        list.innerHTML = '';
        modelGroup.children.slice(0, 30).forEach((m, i) => {
            const div = document.createElement('div');
            div.className = 'part-item';
            div.innerHTML = `<span>Entité ${i+1}</span><button onclick="modelGroup.children[${i}].visible = !modelGroup.children[${i}].visible; updatePartList();">${m.visible?'👁️':'❌'}</button>`;
            list.appendChild(div);
        });
    }

    function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
    window.addEventListener('resize', () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    init();
</script>
</body>
</html>
